<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ultimate Money Planner</title>
<style>
:root{
  --bg:#0E0E1C;--surface:#16162A;--card:#1E1E38;--card2:#262645;
  --border:#2A2A50;--border2:#353565;
  --ink:#F0F0FF;--ink2:#9090B8;--ink3:#505078;
  --gold:#D4A843;--gold2:#F5C842;--gold-dim:#2A2010;
  --green:#1DB87A;--green-dim:#0D2A1A;
  --red:#E84B6A;--red-dim:#2A0D15;
  --blue:#3B6EF8;--blue-dim:#0D1A35;
  --purple:#6C47FF;--purple-dim:#18103A;
  --amber:#F59E0B;--amber-dim:#2A1F08;
  --teal:#14B8A6;--teal-dim:#0A1F1E;
  --r:12px;--r-sm:8px;--r-xs:5px;
  --sh:0 4px 24px rgba(0,0,0,0.4);
  --tr:0.18s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
.shell{display:flex;min-height:100vh}
.sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;
  transform:translateX(0);transition:transform var(--tr);overflow-y:auto}
.sidebar-logo{padding:0.9rem 1rem 0.7rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:0.55rem;flex-shrink:0}
.logo-mark{width:30px;height:30px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--purple),var(--green));
  display:flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:900;color:#fff}
.logo-text{font-size:0.8rem;font-weight:800;letter-spacing:-0.02em;line-height:1.2}
.logo-sub{font-size:0.6rem;color:var(--ink2);margin-top:0.1rem}
.nav-section{padding:0.5rem 0;flex-shrink:0}
.nav-label{font-size:0.58rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--ink3);padding:0.3rem 0.9rem}
.nav-item{display:flex;align-items:center;gap:0.55rem;padding:0.45rem 0.9rem;
  font-size:0.78rem;font-weight:500;color:var(--ink2);cursor:pointer;transition:var(--tr);
  border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--ink)}
.nav-item.active{background:rgba(108,71,255,0.12);color:var(--purple);border-left-color:var(--purple);font-weight:700}
.ni{font-size:0.9rem;flex-shrink:0;width:16px;text-align:center}
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:50px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.25rem;position:sticky;top:0;z-index:40;flex-shrink:0}
.topbar-title{font-size:0.92rem;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:0.4rem}
.icon-btn{width:30px;height:30px;border-radius:var(--r-sm);display:flex;align-items:center;
  justify-content:center;font-size:0.85rem;color:var(--ink2);transition:var(--tr);
  background:var(--card);border:1px solid var(--border)}
.icon-btn:hover{color:var(--ink);border-color:var(--border2)}
.content{flex:1;padding:1.25rem;overflow-y:auto}
.sidebar-footer{margin-top:auto;flex-shrink:0;padding:0.85rem 0.9rem;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:0.5rem;align-items:center;text-align:center}
.footer-love{font-size:0.66rem;color:var(--ink3)}
.bmc-link{display:inline-flex;align-items:center;gap:0.3rem;padding:0.4rem 0.7rem;border-radius:99px;
  font-size:0.68rem;font-weight:700;color:var(--gold);background:var(--gold-dim);
  border:1px solid rgba(212,168,67,0.25);transition:var(--tr);text-decoration:none;white-space:nowrap}
.bmc-link:hover{background:var(--gold);color:#0E0E1C}
.bmc-btn{display:inline-flex;align-items:center;gap:0.35rem;padding:0.5rem 0.9rem;border-radius:99px;
  font-size:0.76rem;font-weight:700;color:var(--gold);background:var(--gold-dim);
  border:1px solid rgba(212,168,67,0.25);transition:var(--tr);text-decoration:none}
.bmc-btn:hover{background:var(--gold);color:#0E0E1C}
body.light .sidebar-footer{border-top-color:#DDDDF0}
body.light .footer-love{color:#9090A8}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:49}
.overlay.show{display:block}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem;box-shadow:var(--sh)}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.85rem}
.card-hd h3{font-size:0.85rem;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0.85rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.7rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0.7rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:0.9rem;transition:var(--tr)}
.stat-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.stat-icon{font-size:1.1rem;margin-bottom:0.35rem}
.stat-label{font-size:0.62rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:0.18rem}
.stat-value{font-size:1.35rem;font-weight:800;letter-spacing:-0.03em;line-height:1}
.stat-sub{font-size:0.68rem;color:var(--ink2);margin-top:0.18rem}
.form-group{margin-bottom:0.75rem}
.form-group label{display:block;font-size:0.7rem;font-weight:700;color:var(--ink2);margin-bottom:0.28rem;letter-spacing:0.03em}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.6rem}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:0.5rem 0.7rem;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r-sm);color:var(--ink);font-size:0.82rem;transition:var(--tr);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple);background:var(--card);box-shadow:0 0 0 3px rgba(108,71,255,0.15)}
select option{background:var(--card)}
textarea{resize:vertical;min-height:75px;line-height:1.5}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.3rem;
  padding:0.5rem 0.9rem;border-radius:var(--r-sm);font-size:0.8rem;font-weight:700;transition:var(--tr);white-space:nowrap}
.btn-primary{background:var(--purple);color:#fff}.btn-primary:hover{background:#5535E0;transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:#0E0E1C}.btn-gold:hover{background:var(--gold2)}
.btn-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(29,184,122,0.2)}.btn-green:hover{background:var(--green);color:#fff}
.btn-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(232,75,106,0.2)}.btn-red:hover{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--border)}.btn-ghost:hover{border-color:var(--border2);color:var(--ink)}
.btn-sm{padding:0.3rem 0.65rem;font-size:0.72rem}.btn-block{width:100%;display:flex}
.badge{display:inline-flex;align-items:center;gap:0.2rem;padding:0.15rem 0.45rem;border-radius:99px;font-size:0.65rem;font-weight:700}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-red{background:var(--red-dim);color:var(--red)}
.badge-gold{background:var(--gold-dim);color:var(--gold)}
.badge-purple{background:var(--purple-dim);color:var(--purple)}
.badge-blue{background:var(--blue-dim);color:var(--blue)}
.badge-amber{background:var(--amber-dim);color:var(--amber)}
.badge-teal{background:var(--teal-dim);color:var(--teal)}
.progress-track{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;transition:width 0.8s cubic-bezier(.4,0,.2,1)}
.data-table{width:100%;border-collapse:collapse;font-size:0.78rem}
.data-table th{text-align:left;padding:0.45rem 0.7rem;font-size:0.62rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td{padding:0.55rem 0.7rem;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(255,255,255,0.02)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-back.open{opacity:1;pointer-events:all}
.modal{background:var(--card);border-radius:var(--r) var(--r) 0 0;
  padding:1.25rem 1.1rem 2rem;width:100%;max-width:500px;
  transform:translateY(40px);transition:transform 0.28s cubic-bezier(.4,0,.2,1);max-height:92vh;overflow-y:auto}
.modal-back.open .modal{transform:translateY(0)}
.modal-handle{width:34px;height:4px;background:var(--border2);border-radius:99px;margin:0 auto 1rem}
.modal h3{font-size:0.95rem;font-weight:800;margin-bottom:0.9rem}
#toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--bg);padding:0.5rem 1rem;border-radius:99px;
  font-size:0.78rem;font-weight:700;opacity:0;transition:all 0.28s ease;
  pointer-events:none;z-index:999;white-space:nowrap;box-shadow:var(--sh)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.9rem}
.sec-hd h2{font-size:0.92rem;font-weight:800}
.sec-sub{font-size:0.76rem;color:var(--ink2);margin-bottom:0.9rem;line-height:1.5}
.month-strip{display:flex;gap:0.28rem;overflow-x:auto;padding-bottom:0.25rem;margin-bottom:0.9rem;scrollbar-width:none}
.month-strip::-webkit-scrollbar{display:none}
.month-pill{flex-shrink:0;padding:0.28rem 0.7rem;border-radius:99px;font-size:0.72rem;font-weight:700;border:1.5px solid var(--border);color:var(--ink2);cursor:pointer;transition:var(--tr)}
.month-pill.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.chart-wrap{width:100%;overflow:hidden}
.div{height:1px;background:var(--border);margin:0.9rem 0}
.empty{text-align:center;padding:2rem 1rem;color:var(--ink2)}
.empty-icon{font-size:2.2rem;margin-bottom:0.5rem}
.empty p{font-size:0.82rem;line-height:1.5}
.alert{display:flex;align-items:flex-start;gap:0.5rem;padding:0.7rem 0.85rem;border-radius:var(--r-sm);margin-bottom:0.9rem;font-size:0.78rem;line-height:1.45}
.alert a{color:inherit;font-weight:800;text-decoration:underline}
.alert-warn{background:var(--amber-dim);color:#E5A20B;border:1px solid rgba(245,158,11,0.2)}
.alert-good{background:var(--green-dim);color:var(--green);border:1px solid rgba(29,184,122,0.2)}
.alert-bad{background:var(--red-dim);color:var(--red);border:1px solid rgba(232,75,106,0.2)}
.alert-info{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(59,110,248,0.2)}
.gauge-wrap{display:flex;flex-direction:column;align-items:center}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;
  background:rgba(22,22,42,0.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);z-index:90;padding-bottom:env(safe-area-inset-bottom)}
.bnav-scroll{display:flex;overflow-x:auto;scrollbar-width:none}
.bnav-scroll::-webkit-scrollbar{display:none}
.bnav-item{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0.45rem 0.55rem;min-width:56px;color:var(--ink2);font-size:0.52rem;font-weight:700;cursor:pointer;transition:var(--tr)}
.bnav-item.active{color:var(--purple)}
.bnav-icon{font-size:1.1rem;line-height:1;margin-bottom:0.12rem}
.onboard{position:fixed;inset:0;background:var(--bg);z-index:300;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.5rem;text-align:center;overflow-y:auto}
.ob-logo{width:68px;height:68px;border-radius:18px;
  background:linear-gradient(135deg,var(--purple),var(--green));
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;margin:0 auto 1.25rem;box-shadow:0 8px 32px rgba(108,71,255,0.4)}
.ob-steps{display:flex;gap:0.35rem;margin:1.1rem 0 0.3rem}
.ob-step{width:20px;height:4px;border-radius:99px;background:var(--border);transition:var(--tr)}
.ob-step.done{background:var(--purple)}
.menu-btn{display:none;position:fixed;bottom:5rem;right:1rem;z-index:200;
  width:44px;height:44px;border-radius:50%;background:var(--purple);
  font-size:1.1rem;color:#fff;box-shadow:var(--sh);align-items:center;justify-content:center}
.confetti-p{position:fixed;pointer-events:none;z-index:9999;border-radius:2px;
  animation:confDrop 2.2s ease-out forwards}
@keyframes confDrop{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.3s ease forwards}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0}.bottom-nav{display:block}
  .content{padding:1rem;padding-bottom:5.5rem}
  .grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}
  .menu-btn{display:flex}
}
@media(max-width:480px){.form-row,.form-row-3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media(min-width:640px){.modal-back{align-items:center}.modal{border-radius:var(--r);max-width:450px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body.light{
  --bg:#F4F4FA;--surface:#FFFFFF;--card:#FFFFFF;--card2:#F0F0FA;
  --border:#DDDDF0;--border2:#CACAE0;
  --ink:#0E0E1C;--ink2:#555570;--ink3:#9090A8;
  --gold-dim:#FBF4E3;--green-dim:#E4F7EE;--red-dim:#FDEDEC;
  --blue-dim:#EBF5FB;--purple-dim:#F0ECFF;--amber-dim:#FEF9E7;
  --teal-dim:#E4F7F5;
}
body.light .sidebar{background:#FFFFFF;border-right-color:#DDDDF0}
body.light .topbar{background:#FFFFFF;border-bottom-color:#DDDDF0}
body.light .modal{background:#FFFFFF}
body.light .bottom-nav{background:rgba(255,255,255,0.96);border-top-color:#DDDDF0}
body.light .onboard{background:#F4F4FA}
body.light .stat-card{background:#FFFFFF;border-color:#DDDDF0}
body.light .data-table th{color:#555570}
body.light .data-table td{border-bottom-color:#EEEEF8}
body.light .alert-info{background:#EBF5FB;color:#2563EB}
body.light .alert-good{background:#E4F7EE;color:#16A34A}
body.light .alert-warn{background:#FEF9E7;color:#B45309}
body.light .alert-bad{background:#FDEDEC;color:#DC2626}
body.light .nav-item{color:#555570}
body.light .nav-item:hover{background:rgba(0,0,0,0.04);color:#0E0E1C}
body.light .nav-item.active{background:rgba(108,71,255,0.1);color:var(--purple)}
body.light .logo-text{color:#0E0E1C}
body.light .logo-sub{color:#9090A8}
body.light .topbar-title{color:#0E0E1C}
body.light .icon-btn{background:#F4F4FA;border-color:#DDDDF0;color:#555570}
body.light .icon-btn:hover{color:#0E0E1C}
body.light .month-pill{border-color:#DDDDF0;color:#555570}
body.light .bnav-item{color:#9090A8}
body.light .bnav-item.active{color:var(--purple)}
body.light input[type=text],body.light input[type=number],body.light input[type=date],body.light select,body.light textarea{background:#F4F4FA;border-color:#DDDDF0;color:#0E0E1C}
body.light input:focus,body.light select:focus,body.light textarea:focus{background:#FFFFFF}

</style>
</head>
<body>
<div class="onboard" id="OB">
  <div class="ob-logo">💰</div>
  <div class="ob-steps" id="OB_STEPS"></div>
  <div id="OB_CONTENT"></div>
</div>
<div class="shell" id="APP" style="display:none">
  <aside class="sidebar" id="SIDEBAR">
    <div class="sidebar-logo">
      <div class="logo-mark">💰</div>
      <div><div class="logo-text">Money Planner</div><div class="logo-sub">Ultimate Edition</div></div>
    </div>
    <div id="SIDENAV"></div>
    <div class="sidebar-footer">
      <div class="footer-love">Built with ❤️</div>
      <a href="https://www.buymeacoffee.com/gorj" target="_blank" rel="noopener" class="bmc-link">☕ Buy me a coffee</a>
    </div>
  </aside>
  <div class="overlay" id="OVERLAY" onclick="closeSidebar()"></div>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="TB_TITLE">Dashboard</span>
      <div class="topbar-right">
        <button class="icon-btn" onclick="shareApp()" title="Share">📤</button>
        <button class="icon-btn" id="THEME_BTN" onclick="toggleTheme()" title="Toggle light/dark">🌙</button>
        <button class="icon-btn" onclick="exportData()" title="Export">⬇️</button>
        <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
      </div>
    </div>
    <div class="content" id="CONTENT"></div>
  </div>
  <nav class="bottom-nav"><div class="bnav-scroll" id="BNAV"></div></nav>
</div>
<button class="menu-btn" id="MENUBTN" onclick="toggleSidebar()">☰</button>
<div id="toast"></div>
<div class="modal-back" id="MODAL">
  <div class="modal"><div class="modal-handle"></div><div id="MODAL_BODY"></div></div>
</div>

  {id:'distribution',icon:'📉',name:'I&E Distribution',group:'Analysis'},
  {id:'rule503020',icon:'⚖️',name:'50/30/20',group:'Analysis'},

/* ── CHARTS ── */
function donut(data,total,sz=130){
  if(!total||!data.length)return`<div style="text-align:center;padding:1rem;color:var(--ink2);font-size:0.78rem">No data yet</div>`;
  const cx=sz/2,cy=sz/2,r=sz*.37,sw=sz*.13,circ=2*Math.PI*r;let off=0,paths='';
  data.forEach(d=>{const dash=(d.value/total)*circ;
    paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${sw}"
      stroke-dasharray="${dash.toFixed(2)} ${circ.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=dash;});
  return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${sw}"/>${paths}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="${sz*.09}" font-weight="800" fill="var(--ink)">${fmt(total,0)}</text>
    <text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="${sz*.065}" fill="var(--ink2)">total</text>
  </svg>`;
}
function bars(data,h=130){
  if(!data.length)return`<div style="text-align:center;padding:1rem;color:var(--ink2);font-size:0.78rem">No data</div>`;
  const max=Math.max(...data.map(d=>Math.abs(d.value)),1),w=100/data.length;
  const b=data.map((d,i)=>{const ht=Math.max(2,(Math.abs(d.value)/max)*78);const y=d.value>=0?h-ht-18:h-18;
    return`<g><rect x="${i*w+w*.12}%" y="${y}" width="${w*.76}%" height="${ht}" fill="${d.value<0?'var(--red)':d.color||'var(--purple)'}" rx="3" opacity="0.85"/>
      <text x="${i*w+w/2}%" y="${h-4}" text-anchor="middle" font-size="7.5" fill="var(--ink2)">${d.label||''}</text></g>`;}).join('');
  return`<svg width="100%" height="${h}" viewBox="0 0 100 ${h}" preserveAspectRatio="none">
    <line x1="0" y1="${h-18}" x2="100" y2="${h-18}" stroke="var(--border)" stroke-width="0.5"/>${b}</svg>`;
}
function linechart(data,h=120,color='var(--gold)'){
  if(data.length<2)return`<div style="text-align:center;padding:1rem;color:var(--ink2);font-size:0.78rem">Not enough data</div>`;
  const vals=data.map(d=>d.value),mn=Math.min(...vals),mx=Math.max(...vals,1),rng=mx-mn||1,pd=10;
  const pts=data.map((d,i)=>`${(pd+(i/(data.length-1))*(100-pd*2)).toFixed(1)},${(pd+(1-(d.value-mn)/rng)*(h-pd*2)).toFixed(1)}`);
  const cirs=data.map((d,i)=>{const x=pd+(i/(data.length-1))*(100-pd*2),y=pd+(1-(d.value-mn)/rng)*(h-pd*2);
    return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${color}"/>`}).join('');
  return`<svg width="100%" height="${h}" viewBox="0 0 100 ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${pts.join(' ')} ${100-pd},${h-pd} ${pd},${h-pd}" fill="url(#lg)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>${cirs}</svg>`;
}
function gauge(pv,color='var(--green)',sz=140){
  const cl=Math.min(pv,100),r=55,c=Math.PI*r,d=(cl/100)*c;
  return`<svg width="${sz}" height="${sz/2+10}" viewBox="0 0 ${sz} ${sz/2+10}">
    <path d="M${sz/2-r} ${sz/2} A${r} ${r} 0 0 1 ${sz/2+r} ${sz/2}" fill="none" stroke="var(--border)" stroke-width="12" stroke-linecap="round"/>
    <path d="M${sz/2-r} ${sz/2} A${r} ${r} 0 0 1 ${sz/2+r} ${sz/2}" fill="none" stroke="${color}" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="${d.toFixed(2)} ${c.toFixed(2)}"/>
    <text x="${sz/2}" y="${sz/2-5}" text-anchor="middle" font-size="19" font-weight="800" fill="${color}">${Math.round(pv)}%</text>
    <text x="${sz/2}" y="${sz/2+9}" text-anchor="middle" font-size="7.5" fill="var(--ink2)">SAVINGS RATE</text>
  </svg>`;
}
function hbars(data){
  return data.map(d=>{const p=Math.min(100,d.pct||0);
    const c=p>100?'var(--red)':p>80?'var(--amber)':d.color||'var(--purple)';
    return`<div style="margin-bottom:0.5rem">
      <div style="display:flex;justify-content:space-between;font-size:0.7rem;margin-bottom:0.18rem">
        <span>${d.emoji||''} ${d.label}</span>
        <span style="color:var(--ink2)">${fmt(d.value,0)}${d.budget?' / '+fmt(d.budget,0):''}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${p}%;background:${c}"></div></div>
    </div>`}).join('');
}

/* ══ 4. INCOME TRACKER ══ */
let _incYear=NOW.getFullYear();
let _incMon=CUR_MONTH;

function mkKey(yr,mo){return`${yr}-${String(mo+1).padStart(2,'0')}`}
function monthName(mk){const i=parseInt(mk.split('-')[1])-1;return MF[i]||mk}

function renderIncome(){
  const mTotals=MONTHS.map((_,i)=>mInc(mkKey(_incYear,i)));
  const annual=mTotals.reduce((s,v)=>s+v,0);
  document.getElementById('CONTENT').innerHTML=`
    <div class="grid2" style="margin-bottom:0.85rem">
      <div class="stat-card"><div class="stat-label">Annual Income</div><div class="stat-value" style="color:var(--green)">${fmt(annual)}</div></div>
      <div class="stat-card"><div class="stat-label">Monthly Average</div><div class="stat-value" style="color:var(--teal)">${fmt(annual/12)}</div></div>
    </div>
    <div class="card" style="margin-bottom:0.85rem">
      <div class="card-hd"><h3>📊 Monthly Income</h3></div>
      <div class="chart-wrap">${bars(mTotals.map((v,i)=>({label:MONTHS[i],value:v,color:'var(--green)'})))}</div>
    </div>
    <div class="card">
      <div class="card-hd"><h3>💰 Log Income by Month</h3><button class="btn btn-primary btn-sm" onclick="openIncModal()">+ Log</button></div>
      <div class="month-strip" id="INC_STRIP">${incMonthStrip()}</div>
      <div id="INC_DETAIL">${incDetail(_incMon)}</div>
    </div>`;
}

function incMonthStrip(){
  return MONTHS.map((m,i)=>{
    const mk=mkKey(_incYear,i);
    return`<div class="month-pill${mk===_incMon?' active':''}" onclick="selIncMon('${mk}')">${m}</div>`;
  }).join('');
}

function selIncMon(mk){
  _incMon=mk;
  document.querySelectorAll('#INC_STRIP .month-pill').forEach((p,i)=>p.classList.toggle('active',mkKey(_incYear,i)===mk));
  document.getElementById('INC_DETAIL').innerHTML=incDetail(mk);
}

function incDetail(mk){
  const d=G.income(),v=d[mk];
  const label=monthName(mk);
  if(!v&&v!==0)return`<div class="empty" style="padding:0.75rem"><div class="empty-icon" style="font-size:1.4rem">💰</div><p style="font-size:0.78rem">No income for <strong>${label}</strong></p><p style="font-size:0.72rem;color:var(--ink2);margin-top:0.3rem">Tap + Log to add income for this month</p></div>`;
  if(typeof v==='number')return`<div style="display:flex;justify-content:space-between;align-items:center;padding:0.6rem;background:var(--surface);border-radius:var(--r-sm)"><span>Total Income — ${label}</span><span style="font-weight:800;color:var(--green)">${fmt(v)}</span></div>`;
  const entries=Object.entries(v).filter(([k])=>k!=='__total__');
  const total=entries.reduce((s,[,x])=>s+x,0);
  return`<div style="font-size:0.72rem;color:var(--ink2);margin-bottom:0.5rem;font-weight:700">${label}</div>
  <table class="data-table"><thead><tr><th>Source</th><th>Amount</th><th></th></tr></thead><tbody>
    ${entries.map(([src,amt])=>`<tr><td>${src}</td><td style="color:var(--green);font-weight:700">${fmt(amt)}</td>
      <td><button class="btn btn-red btn-sm" onclick="delIncEntry('${mk}','${src}')">✕</button></td></tr>`).join('')}</tbody>
    <tfoot><tr><td style="font-weight:800">TOTAL</td><td style="font-weight:800;color:var(--green)">${fmt(total)}</td><td></td></tr></tfoot></table>`;}

function openIncModal(){
  const opts=MONTHS.map((m,i)=>{const k=mkKey(NOW.getFullYear(),i);return`<option value="${k}"${k===_incMon?' selected':''}>${m}</option>`;});
  openModal(`<h3>Log Income</h3>
  <div class="form-group"><label>Source</label><input type="text" id="i_s" placeholder="e.g. Salary, Freelance, LemonSqueezy"></div>
  <div class="form-row"><div class="form-group"><label>Amount (${cur()})</label><input type="number" id="i_a" placeholder="0.00" min="0" step="0.01"></div>
    <div class="form-group"><label>Month</label><select id="i_m">${opts.join('')}</select></div></div>
  <div style="display:flex;gap:0.6rem;margin-top:0.5rem"><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" style="flex:2" onclick="saveIncEntry()">Save</button></div>`);}

function saveIncEntry(){
  const src=document.getElementById('i_s').value.trim(),amt=parseFloat(document.getElementById('i_a').value)||0,mon=document.getElementById('i_m').value;
  if(!src||!amt){toast('Fill all fields');return}
  const inc=G.income();if(!inc[mon]||typeof inc[mon]==='number')inc[mon]={};
  inc[mon][src]=(inc[mon][src]||0)+amt;ss(K.income,inc);closeModal();toast('Logged ✓','good');renderIncome();}

function delIncEntry(mk,src){
  const inc=G.income();if(inc[mk]&&typeof inc[mk]==='object')delete inc[mk][src];
  ss(K.income,inc);document.getElementById('INC_DETAIL').innerHTML=incDetail(mk);}

          <div style="display:flex;gap:0.3rem;align-items:center">
            <span class="badge badge-${p>=100?'green':p>=25?'purple':'amber'}">${p>=100?'✅ Done':pct(p)}</span>
            <button class="btn btn-ghost btn-sm" onclick="openGoalModal('${g.id}')">✏️</button>
            <button class="btn btn-red btn-sm" onclick="delGoal('${g.id}')">✕</button></div></div>
        <div class="progress-track" style="margin-bottom:0.45rem"><div class="progress-fill" style="width:${p}%;background:${col}"></div></div>

          <span>${fmt(rem)} remaining</span>

        ${mNeed&&dl>0&&p<100?`<div style="margin-top:0.35rem;font-size:0.7rem;color:var(--purple);font-weight:700">Save ${fmt(mNeed)}/month to hit deadline</div>`:''}
        ${g.notes?`<div style="margin-top:0.45rem;padding:0.45rem;background:var(--surface);border-radius:var(--r-sm);font-size:0.72rem;color:var(--ink2)">${g.notes}</div>`:''}
      </div>`;}).join('')
    :`<div class="empty"><div class="empty-icon">🎯</div><p>No goals yet. Add your first money goal.</p></div>`}`;
}
function openGoalModal(id){
  const g=id?G.goals().find(x=>x.id===id):null;
  openModal(`<h3>${g?'Edit':'Add'} Goal</h3>
    <div class="form-group"><label>Goal Name</label><input type="text" id="g_n" value="${g?.name||''}" placeholder="e.g. Emergency Fund"></div>
    <div class="form-row">
      <div class="form-group"><label>Target (${cur()})</label><input type="number" id="g_t" value="${g?.target||''}" placeholder="5000" min="1"></div>
      <div class="form-group"><label>Saved So Far</label><input type="number" id="g_s" value="${g?.saved||''}" placeholder="0" min="0"></div></div>

      <div class="form-group"><label>Deadline</label><input type="date" id="g_d" value="${g?.deadline||''}"></div>

    <div class="form-group"><label>Notes</label><textarea id="g_no" rows="2">${g?.notes||''}</textarea></div>
    <input type="hidden" id="g_id" value="${id||''}">

      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:2" onclick="saveGoal()">Save</button></div>`);}
function saveGoal(){
  const n=document.getElementById('g_n').value.trim(),t=parseFloat(document.getElementById('g_t').value)||0,s=parseFloat(document.getElementById('g_s').value)||0;
  if(!n||t<=0){toast('Enter name and target');return}
  const goals=G.goals(),eid=document.getElementById('g_id').value;
  const wasDone=eid?goals.find(g=>g.id===eid)?.saved>=goals.find(g=>g.id===eid)?.target:false;
  const obj={name:n,target:t,saved:s,deadline:document.getElementById('g_d').value,emoji:document.getElementById('g_e').value||'🎯',notes:document.getElementById('g_no').value};
  if(eid){const i=goals.findIndex(g=>g.id===eid);if(i>-1)goals[i]={...goals[i],...obj};}
  else goals.push({id:uid(),...obj});
  ss(K.goals,goals);closeModal();
  if(s>=t&&!wasDone){setTimeout(()=>{confetti(60);toast('🎉 Goal completed!','good')},200);}
  else toast(eid?'Updated ✓':'Goal added ✓','good');
  renderGoals();}
function delGoal(id){ss(K.goals,G.goals().filter(g=>g.id!==id));toast('Removed');renderGoals();}

/* ══ 12. DEBT PAYOFF ══ */
function renderDebt(){
  const debts=G.debt(),total=debts.reduce((s,d)=>s+d.balance,0);
  const tInt=debts.reduce((s,d)=>{const mp=(d.minPayment||0)+(d.extra||0),r=(d.rate||0)/12;
    const m=mp>r*d.balance&&r>0?Math.ceil(-Math.log(1-d.balance*r/mp)/Math.log(1+r)):mp>0&&r===0?Math.ceil(d.balance/mp):999;
    return s+(m<999?mp*m-d.balance:0)},0);
  document.getElementById('CONTENT').innerHTML=`
    <div class="grid3" style="margin-bottom:0.85rem">
      <div class="stat-card"><div class="stat-label">Total Debt</div><div class="stat-value" style="color:var(--red)">${fmt(total)}</div></div>
      <div class="stat-card"><div class="stat-label">Est. Total Interest</div><div class="stat-value" style="color:var(--amber)">${fmt(tInt)}</div></div>
      <div class="stat-card"><div class="stat-label">Debts Tracked</div><div class="stat-value">${debts.length}</div></div>
    </div>
    <div class="card" style="margin-bottom:0.85rem">
      <div class="card-hd"><h3>💳 Debt Tracker</h3><button class="btn btn-primary btn-sm" onclick="openDebtModal()">+ Add</button></div>
      ${debts.length?`<table class="data-table"><thead><tr><th>Debt</th><th>Balance</th><th>Rate</th><th>Payment</th><th>Extra</th><th>Months</th><th>Interest</th><th>Status</th><th></th></tr></thead><tbody>
        ${debts.map(d=>{const mp=(d.minPayment||0)+(d.extra||0),r=(d.rate||0)/12;
          const m=mp>r*d.balance&&r>0?Math.ceil(-Math.log(1-d.balance*r/mp)/Math.log(1+r)):mp>0&&r===0?Math.ceil(d.balance/mp):999;
          const int=m<999?mp*m-d.balance:0,st=d.balance<=0?'✅ Paid':m<=6?'🔥 Almost!':m<=24?'📉 Progress':'⏳ Long';
          return`<tr><td style="font-weight:700">${d.name}</td><td style="color:var(--red);font-weight:700">${fmt(d.balance)}</td>
            <td>${((d.rate||0)*100).toFixed(1)}%</td><td>${fmt(d.minPayment||0)}</td>
            <td style="color:var(--green)">${d.extra>0?'+'+fmt(d.extra):'-'}</td>
            <td style="font-weight:700;color:var(--amber)">${m<999?m:'∞'}</td>
            <td style="color:var(--red)">${int>0?fmt(int):'—'}</td>
            <td style="font-size:0.75rem">${st}</td>
            <td><button class="btn btn-red btn-sm" onclick="delDebt('${d.id}')">✕</button></td></tr>`;}).join('')}</tbody></table>`
      :`<div class="empty"><div class="empty-icon">💳</div><p>No debts tracked. Add a debt to see your payoff timeline.</p></div>`}
    </div>
    <div class="card"><div class="card-hd"><h3>💡 Payoff Strategies</h3></div>
      <div class="grid2">
        <div style="padding:0.8rem;background:var(--surface);border-radius:var(--r-sm)"><div style="font-size:0.82rem;font-weight:800;margin-bottom:0.25rem">❄️ Debt Snowball</div><div style="font-size:0.75rem;color:var(--ink2);line-height:1.5">Pay minimums on all. Attack <strong style="color:var(--ink)">smallest balance</strong> first. Fast wins, great motivation.</div></div>
        <div style="padding:0.8rem;background:var(--surface);border-radius:var(--r-sm)"><div style="font-size:0.82rem;font-weight:800;margin-bottom:0.25rem">🏔️ Debt Avalanche</div><div style="font-size:0.75rem;color:var(--ink2);line-height:1.5">Pay minimums on all. Attack <strong style="color:var(--ink)">highest interest rate</strong> first. Saves the most money.</div></div>
      </div></div>`;
}
function openDebtModal(){openModal(`<h3>Add Debt</h3>
  <div class="form-group"><label>Debt Name</label><input type="text" id="dt_n" placeholder="e.g. Student Loan"></div>
  <div class="form-row"><div class="form-group"><label>Balance (${cur()})</label><input type="number" id="dt_b" placeholder="0.00" min="0" step="0.01"></div>
    <div class="form-group"><label>Annual Interest Rate (%)</label><input type="number" id="dt_r" placeholder="e.g. 12.5" min="0" max="100" step="0.1"></div></div>
  <div class="form-row"><div class="form-group"><label>Min Payment (${cur()})</label><input type="number" id="dt_m" placeholder="0.00" min="0" step="0.01"></div>
    <div class="form-group"><label>Extra Payment (${cur()})</label><input type="number" id="dt_e" placeholder="0.00" min="0" step="0.01"></div></div>
  <div style="display:flex;gap:0.6rem;margin-top:0.5rem"><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button>

function saveDebt(){const n=document.getElementById('dt_n').value.trim(),b=parseFloat(document.getElementById('dt_b').value)||0;

  const debts=G.debt();debts.push({id:uid(),name:n,balance:b,rate:parseFloat(document.getElementById('dt_r').value)/100||0,minPayment:parseFloat(document.getElementById('dt_m').value)||0,extra:parseFloat(document.getElementById('dt_e').value)||0});
  ss(K.debt,debts);closeModal();toast('Debt added ✓','good');renderDebt();}
function delDebt(id){ss(K.debt,G.debt().filter(d=>d.id!==id));renderDebt();}

/* ══ 13. EMERGENCY FUND ══ */

        ${[{l:'Monthly Expenses',v:fmt(ef.monthly_expenses)},{l:'Target Coverage',v:ef.target_months+' months'},{l:'Monthly Contribution',v:fmt(ef.monthly_contribution),c:'var(--green)'},{l:'Months to Fund',v:ml>0?ml+'mo':'—',c:'var(--amber)'}].map(s=>`<div style="padding:0.65rem;background:var(--surface);border-radius:var(--r-sm)"><div style="font-size:0.68rem;color:var(--ink2)">${s.l}</div><div style="font-size:1.1rem;font-weight:800;color:${s.c||'var(--ink)'}">${s.v}</div></div>`).join('')}

        <div style="flex:1;min-width:150px">
          ${[{l:'Target',v:fmt(target),c:'var(--blue)'},{l:'Current',v:fmt(ef.current),c:'var(--green)'},{l:'Remaining',v:fmt(rem),c:'var(--red)'},{l:'Coverage',v:cov.toFixed(1)+' months',c:'var(--amber)'}].map(s=>`<div style="display:flex;justify-content:space-between;padding:0.38rem 0;border-bottom:1px solid var(--border)"><span style="font-size:0.75rem;color:var(--ink2)">${s.l}</span><span style="font-size:0.82rem;font-weight:700;color:${s.c}">${s.v}</span></div>`).join('')}
          <div style="margin-top:0.65rem"><span class="badge badge-${pv>=100?'green':pv>=50?'amber':'red'}">${pv>=100?'✅ Fully Funded!':pv>=50?'🔥 Halfway!':pv>=25?'💪 Keep Going!':'🎯 Just Started'}</span></div>

        💡 Aim for <strong style="color:var(--ink)">3 months</strong> with a stable job · <strong style="color:var(--ink)">6 months</strong> if self-employed · <strong style="color:var(--ink)">9–12 months</strong> if you have dependants

/* ══ 14. SINKING FUNDS ══ */
function renderSinking(){
  const funds=G.sinking(),tT=funds.reduce((s,f)=>s+f.target,0),tS=funds.reduce((s,f)=>s+f.saved,0);
  document.getElementById('CONTENT').innerHTML=`
    <div class="alert alert-info">💡 A Sinking Fund = saving a small amount monthly for a known future expense. e.g. Save ${cur()}100/month now so a ${cur()}1,200 bill doesn't hurt.</div>
    <div class="grid3" style="margin-bottom:0.85rem">
      <div class="stat-card"><div class="stat-label">Total Target</div><div class="stat-value" style="color:var(--blue)">${fmt(tT)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Saved</div><div class="stat-value" style="color:var(--green)">${fmt(tS)}</div></div>

    </div>

        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.55rem">
          <div><div style="font-size:0.9rem;font-weight:800">${f.name}</div>
            <div style="font-size:0.7rem;color:var(--ink2)">${fmt(f.saved)} of ${fmt(f.target)}${f.date?' · '+f.date:''}</div></div>
          <div style="display:flex;gap:0.3rem">
            <span class="badge badge-${p>=100?'green':p>=75?'purple':'amber'}">${p>=100?'✅ Funded':pct(p)}</span>
            <button class="btn btn-green btn-sm" onclick="openSinkAdd('${f.id}')">+</button>
            <button class="btn btn-red btn-sm" onclick="delSink('${f.id}')">✕</button></div></div>
        <div class="progress-track"><div class="progress-fill" style="width:${p}%;background:${col}"></div></div>
        ${f.target>f.saved?`<div style="margin-top:0.3rem;font-size:0.68rem;color:var(--ink2)">Save ~${fmt((f.target-f.saved)/6,0)}/month to fund in 6 months</div>`:''}
      </div>`;}).join('')
    :`<div class="empty"><div class="empty-icon">🪣</div><p>No sinking funds yet. Start saving for planned expenses.</p></div>`}`;
}
function openSinkModal(){openModal(`<h3>Add Sinking Fund</h3>
  <div class="form-group"><label>Fund Name</label><input type="text" id="sf_n" placeholder="e.g. 🚗 Car Insurance, ✈️ Vacation"></div>
  <div class="form-row"><div class="form-group"><label>Target (${cur()})</label><input type="number" id="sf_t" placeholder="0.00" min="1"></div>

  <div class="form-group"><label>Target Date</label><input type="date" id="sf_d"></div>

function openSinkAdd(id){const f=G.sinking().find(x=>x.id===id);if(!f)return;

  document.getElementById('CONTENT').innerHTML=`

        ${invs.map(i=>`<tr><td style="font-weight:700">${i.name}</td><td><span class="badge badge-blue">${i.type||'Other'}</span></td>

      <div class="stat-card"><div class="stat-label">❌ Slip Days</div><div class="stat-value" style="color:var(--red)">${spD}</div></div>
      <div class="stat-card"><div class="stat-label">💰 Saved</div><div class="stat-value" style="color:var(--gold)">${fmt(saved)}</div></div>
      <div class="stat-card"><div class="stat-label">🔥 Streak</div><div class="stat-value" style="color:var(--amber)">${streak}</div></div>
    </div>
    <div class="card" style="margin-bottom:0.85rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.65rem">
        <h3 style="font-size:0.85rem;font-weight:800">Success Rate</h3>
        <span class="badge badge-${rate2>=80?'green':rate2>=50?'amber':'red'}">${Math.round(rate2)}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${rate2}%;background:var(--green)"></div></div>
    </div>
    <div class="card">
      <div class="card-hd"><h3>📅 Daily Tracker — Tap to toggle</h3></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:0.5rem">
        ${Array.from({length:ns.days},(_,i)=>{const d=i+1,st=log[d],bg=st==='no'?'var(--green-dim)':st==='yes'?'var(--red-dim)':'var(--surface)',fc=st==='no'?'var(--green)':st==='yes'?'var(--red)':'var(--ink2)',ic=st==='no'?'✅':st==='yes'?'❌':'⬜';
          return`<div style="aspect-ratio:1;border-radius:5px;background:${bg};border:1px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:0.62rem;font-weight:700;color:${fc}"

function exportData(){const data={};Object.entries(K).forEach(([k,v])=>{const d=ls(v);if(d)data[k]=d});
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`money-planner-${NOW.toISOString().split('T')[0]}.json`;a.click();toast('Exported ✓','good');}
function importData(evt){
  const file=evt.target.files&&evt.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{data=JSON.parse(reader.result);}catch{toast('That file is not valid backup JSON','bad');evt.target.value='';return;}
    if(typeof data!=='object'||data===null){toast('That file is not valid backup JSON','bad');evt.target.value='';return;}
    const validKeys=Object.keys(K).filter(k=>Object.prototype.hasOwnProperty.call(data,k));
    if(!validKeys.length){toast('No recognizable data in that file','bad');evt.target.value='';return;}
    if(!confirm(`Import backup? This will replace your current data with ${validKeys.length} saved section(s) from this file.`)){evt.target.value='';return;}
    validKeys.forEach(k=>ss(K[k],data[k]));
    toast('Backup imported ✓','good');
    setTimeout(()=>location.reload(),600);
  };
  reader.onerror=()=>toast('Could not read that file','bad');
  reader.readAsText(file);
}
function clearAll(){if(!confirm('⚠️ Delete ALL data? This cannot be undone.'))return;Object.values(K).forEach(v=>localStorage.removeItem(v));location.reload();}

const SHARE_APP_NAME='The Ultimate Money Planner';
const SHARE_URL='https://gorj.systeme.io';
const SHARE_TEXT="Tracked my money and I can finally see exactly where it all goes. Free to use with The Ultimate Money Planner —";
const BMC_URL='https://www.buymeacoffee.com/gorj';
function shareApp(){
  if(navigator.share){
    navigator.share({title:SHARE_APP_NAME,text:SHARE_TEXT,url:SHARE_URL}).catch(()=>{});
    return;
  }
  const full=SHARE_TEXT+' '+SHARE_URL;
  copyShareText(full);
}
function copyShareText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Copied — paste it anywhere ✓','good')).catch(()=>legacyCopy(text));
  }else legacyCopy(text);
}
function legacyCopy(text){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');toast('Copied — paste it anywhere ✓','good');}catch{toast('Could not copy — please copy manually','bad');}
  document.body.removeChild(ta);
}

/* ══ ONBOARDING ══ */
const OB=[
  {title:'Welcome 💰',sub:'19 screens. Every aspect of your finances. Let\'s set up in 60 seconds.',
    html:`<div class="form-group"><label>Your Name (optional)</label><input type="text" id="ob_n" placeholder="e.g. George"></div>
      <div class="form-group"><label>Currency Symbol</label>
        <input type="text" id="ob_c" placeholder="$  ₦  £  €  GH₵  KSh  R  ¥" maxlength="5" style="font-size:1.1rem;text-align:center;letter-spacing:0.05em">
        <div style="font-size:0.68rem;color:var(--ink2);margin-top:0.25rem">Type your symbol — works for every country</div></div>`,
    fn(){const n=document.getElementById('ob_n').value.trim(),c=document.getElementById('ob_c').value.trim();
      if(!c){toast('Enter currency symbol','bad');return}
      const u=G.user();u.name=n;u.currency=c;ss(K.user,u);nextOB();}},
  {title:'Monthly Income 💵',sub:'How much do you earn per month?',
    html:`<div class="form-group"><label>Monthly Income</label>
      <div style="position:relative"><span id="ob_sym" style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--ink2);font-weight:700">$</span>
        <input type="number" id="ob_i" placeholder="0.00" min="0" step="0.01" style="padding-left:1.8rem"></div></div>`,
    fn(){const v=parseFloat(document.getElementById('ob_i').value)||0;const inc=G.income();inc[CUR_MONTH]=v;ss(K.income,inc);nextOB();}},
  {title:'Category Budgets 📋',sub:'How much do you plan to spend per category?',
    html:`<div id="ob_bw"></div>`,
    fn(){const b=G.budget();b[CUR_MONTH]={};CATS.forEach(c=>{const v=parseFloat((document.getElementById('ob_b_'+c.id)||{}).value)||0;if(v>0)b[CUR_MONTH][c.id]=v;});ss(K.budget,b);finishOB();}}
];
let _obStep=0;
function renderOB(){
  const s=OB[_obStep],sym=G.user().currency||'$';
  document.getElementById('OB_STEPS').innerHTML=OB.map((_,i)=>`<div class="ob-step${i<=_obStep?' done':''}"></div>`).join('');
  document.getElementById('OB_CONTENT').innerHTML=`
    <div style="max-width:320px;text-align:left;margin:0 auto">
      <div style="font-size:1.1rem;font-weight:800;margin-bottom:0.35rem;text-align:center">${s.title}</div>
      <div style="font-size:0.8rem;color:var(--ink2);margin-bottom:1.1rem;text-align:center;line-height:1.5">${s.sub}</div>
      <div>${s.html}</div>
      <button class="btn btn-primary btn-block" style="margin-top:0.85rem" onclick="OB[${_obStep}].fn()">Continue →</button>
      <div style="text-align:center;margin-top:0.65rem"><span style="font-size:0.72rem;color:var(--ink2);cursor:pointer" onclick="finishOB()">Skip setup →</span></div>
    </div>`;
  if(_obStep===1){const el=document.getElementById('ob_sym');if(el)el.textContent=sym}
  if(_obStep===2){const w=document.getElementById('ob_bw');if(w)w.innerHTML=CATS.map(c=>`<div class="form-group" style="margin-bottom:0.55rem">
    <label style="font-size:0.72rem">${c.emoji} ${c.name}</label>
    <div style="position:relative"><span style="position:absolute;left:0.7rem;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:0.82rem">${sym}</span>
      <input type="number" id="ob_b_${c.id}" placeholder="0 = no limit" min="0" style="padding-left:1.7rem"></div></div>`).join('');}
}
function nextOB(){_obStep++;renderOB();}
function finishOB(){ss(K.onboard,true);applyTheme();document.getElementById('OB').style.display='none';document.getElementById('APP').style.display='flex';document.getElementById('MENUBTN').style.display='flex';buildNav();renderTab(currentTab);}


/* ══ THEME ══ */
function toggleTheme(){
  const isLight=document.body.classList.toggle('light');
  const btn=document.getElementById('THEME_BTN');
  if(btn)btn.textContent=isLight?'🌞':'🌙';
  const u=G.user();u.theme=isLight?'light':'dark';ss(K.user,u);
}
function applyTheme(){
  const u=G.user();
  if(u.theme==='light'){document.body.classList.add('light');const btn=document.getElementById('THEME_BTN');if(btn)btn.textContent='🌞';}
}

/* ══ INIT ══ */
function init(){
  applyTheme();
  if(!ls(K.onboard)){document.getElementById('OB').style.display='flex';document.getElementById('APP').style.display='none';renderOB();}
  else{document.getElementById('OB').style.display='none';document.getElementById('APP').style.display='flex';document.getElementById('MENUBTN').style.display='flex';buildNav();renderTab(currentTab);}
}
init();
</script>
</body>
</html>
